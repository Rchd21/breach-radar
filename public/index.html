<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breach Radar — fuites de données en direct</title>
  <meta name="description" content="Suivi en direct des fuites de données dans le monde : score de criticité, carte des organisations touchées et conseils pour agir vite.">
  <meta name="theme-color" content="#0b0f17">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230b0f17' stroke='%23ef4444' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%23ef4444'/></svg>">
  <link rel="alternate" type="application/rss+xml" title="Fuites critiques" href="feed.xml">
  <link rel="alternate" hreflang="fr" href="?lang=fr">
  <link rel="alternate" hreflang="en" href="?lang=en">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">
      <span class="radar" aria-hidden="true"></span>
      <span>Breach<b>Radar</b></span>
    </a>
    <nav>
      <a href="#carte" data-i18n="navMap">Carte</a>
      <a href="#fuites" data-i18n="navList">Fuites</a>
      <a href="#concerne" data-i18n="navCheck">Suis-je concerné ?</a>
      <a href="#agir" data-i18n="navAct">Que faire ?</a>
      <a href="#actus" data-i18n="navNews">Actualités</a>
    </nav>
    <span class="live"><i></i><span id="updated" data-i18n="loading">Chargement…</span></span>
    <button class="lang-switch" id="lang-switch" data-i18n="switchLang" data-i18n-aria="switchLangLabel">EN</button>
  </header>

  <main>
    <section class="hero">
      <h1 data-i18n-html="heroTitle">Les fuites de données du monde entier, <em>en direct</em>.</h1>
      <p data-i18n="heroText"></p>
      <div id="watch-alert" class="watch-alert" hidden></div>
      <div class="stats" id="stats"></div>
    </section>

    <section id="carte" class="block">
      <div class="block-head">
        <h2 data-i18n="mapTitle"></h2>
        <div class="filters" id="map-filters">
          <select id="period">
            <option value="7" data-i18n="p7"></option>
            <option value="30" data-i18n="p30"></option>
            <option value="91" data-i18n="p91"></option>
            <option value="0" selected data-i18n="p0"></option>
          </select>
          <div class="chips" id="level-chips"></div>
          <div class="chips" id="type-chips"></div>
        </div>
      </div>
      <div class="map-wrap">
        <div id="map" role="region" data-i18n-aria="mapTitle"></div>
        <aside class="side">
          <h3 data-i18n="latestTitle"></h3>
          <ol id="latest" class="latest"></ol>
        </aside>
      </div>
      <p class="note" id="map-note"></p>
    </section>

    <section id="fuites" class="block">
      <div class="block-head">
        <h2 data-i18n="listTitle"></h2>
        <div class="filters">
          <input id="q" type="search" data-i18n-ph="searchPh" data-i18n-aria="searchPh">
          <select id="country" data-i18n-aria="allCountries"><option value="" data-i18n="allCountries"></option></select>
          <select id="dataclass" data-i18n-aria="allData"><option value="" data-i18n="allData"></option></select>
          <select id="sort" data-i18n-aria="sScore">
            <option value="added" data-i18n="sAdded"></option>
            <option value="score" data-i18n="sScore"></option>
            <option value="count" data-i18n="sCount"></option>
            <option value="date" data-i18n="sDate"></option>
          </select>
        </div>
      </div>
      <p class="result-count" id="result-count"></p>
      <div class="grid" id="list"></div>
      <button class="more" id="more" hidden data-i18n="more"></button>
    </section>

    <section id="concerne" class="block">
      <div class="block-head"><h2 data-i18n="checkTitle"></h2></div>
      <div class="tools">
        <article class="tool">
          <h3 data-i18n="watchTitle"></h3>
          <p data-i18n-html="watchText"></p>
          <form id="watch-form" class="inline-form">
            <input id="watch-input" data-i18n-ph="watchPh" data-i18n-aria="watchPh" autocomplete="off">
            <button type="submit" data-i18n="add"></button>
          </form>
          <div id="watch-tags" class="tags"></div>
          <ul id="watch-results" class="watch-results"></ul>
        </article>

        <article class="tool">
          <h3 data-i18n="pwdTitle"></h3>
          <p data-i18n="pwdText"></p>
          <form id="pwd-form" class="inline-form">
            <input id="pwd" type="password" data-i18n-ph="pwdPh" data-i18n-aria="pwdPh" autocomplete="off">
            <button type="submit" data-i18n="verify"></button>
          </form>
          <p id="pwd-result" class="pwd-result" aria-live="polite"></p>
        </article>

        <article class="tool">
          <h3 data-i18n="emailTitle"></h3>
          <p data-i18n="emailText"></p>
          <div class="btn-col">
            <a class="btn" href="https://haveibeenpwned.com/" target="_blank" rel="noopener">Have I Been Pwned ↗</a>
            <a class="btn ghost" href="https://monitor.mozilla.org/" target="_blank" rel="noopener">Mozilla Monitor ↗</a>
          </div>
          <p class="small" data-i18n-html="rssText"></p>
        </article>
      </div>
    </section>

    <section id="agir" class="block">
      <div class="block-head"><h2 data-i18n="actTitle"></h2></div>
      <div class="advice-grid" id="advice"></div>
      <div class="hotlines">
        <h3 data-i18n="hotlinesTitle"></h3>
        <ul data-i18n-html="hotlines"></ul>
      </div>
    </section>

    <section id="actus" class="block">
      <div class="block-head">
        <h2 data-i18n="newsTitle"></h2>
        <div class="chips" id="news-chips"></div>
      </div>
      <ul class="news" id="news"></ul>
    </section>
  </main>

  <footer>
    <div>
      <h4 data-i18n="methodTitle"></h4>
      <div data-i18n-html="methodText"></div>
    </div>
    <div>
      <h4 data-i18n="sourcesTitle"></h4>
      <div data-i18n-html="sourcesText"></div>
    </div>
  </footer>

  <dialog id="modal" aria-labelledby="m-title">
    <div class="modal-body" id="modal-body"></div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
