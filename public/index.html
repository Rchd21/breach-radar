<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breach Radar — Observatoire des fuites de données</title>
  <meta name="description" content="Suivi consolidé des fuites de données dans le monde : score de sévérité, carte des organisations touchées et recommandations de réponse.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151a21" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23101828'/><path d='M16 7l8 3v6c0 5-3.4 8.4-8 9.5C11.4 24.4 8 21 8 16v-6z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/></svg>">
  <link rel="alternate" type="application/rss+xml" title="Breach Radar" href="feed.xml">
  <link rel="alternate" hreflang="fr" href="?lang=fr">
  <link rel="alternate" hreflang="en" href="?lang=en">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./">
        <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 3l7 2.6v5.2c0 4.4-3 7.4-7 8.6-4-1.2-7-4.2-7-8.6V5.6z" stroke-linejoin="round"/></svg></span>
        Breach Radar <small data-i18n="tagline">Observatoire des fuites</small>
      </a>
      <nav>
        <a href="#carte" data-i18n="navMap">Carte</a>
        <a href="#registre" data-i18n="navList">Registre</a>
        <a href="#exposition" data-i18n="navCheck">Mon exposition</a>
        <a href="#reponse" data-i18n="navAct">Réponse</a>
        <a href="#veille" data-i18n="navNews">Veille</a>
      </nav>
      <div class="top-right">
        <span class="status"><i></i><span id="updated" data-i18n="loading">Chargement…</span></span>
        <div class="seg" id="lang-seg" role="group" aria-label="Langue / Language">
          <button data-lang="fr" aria-pressed="false">FR</button><button data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="page-head">
      <span class="eyebrow" data-i18n="eyebrow"></span>
      <h1 data-i18n="pageTitle"></h1>
      <p data-i18n="pageText"></p>
    </section>

    <div id="watch-alert" class="banner" hidden></div>
    <div class="kpis" id="stats"></div>

    <section id="carte" class="section">
      <div class="panel">
        <div class="panel-head">
          <div><h2 data-i18n="mapTitle"></h2><p data-i18n="mapSub"></p></div>
          <div class="toolbar">
            <div class="field">
              <span class="field-label" data-i18n="fPeriod"></span>
              <select id="period" data-i18n-aria="fPeriod">
                <option value="7" data-i18n="p7"></option>
                <option value="30" data-i18n="p30"></option>
                <option value="91" data-i18n="p91"></option>
                <option value="0" selected data-i18n="p0"></option>
              </select>
            </div>
            <div class="field"><span class="field-label" data-i18n="fSeverity"></span><div class="toggles" id="level-chips"></div></div>
            <div class="field"><span class="field-label" data-i18n="fSource"></span><div class="toggles" id="type-chips"></div></div>
          </div>
        </div>
        <div class="map-wrap">
          <div id="map" role="region" data-i18n-aria="mapTitle"></div>
          <aside class="side">
            <h3 data-i18n="latestTitle"></h3>
            <ol id="latest" class="latest"></ol>
          </aside>
        </div>
        <p class="panel-foot" id="map-note"></p>
      </div>
    </section>

    <section id="registre" class="section">
      <div class="panel">
        <div class="panel-head">
          <div><h2 data-i18n="listTitle"></h2><p id="result-count"></p></div>
          <div class="toolbar">
            <input id="q" type="search" data-i18n-ph="searchPh" data-i18n-aria="searchPh">
            <select id="country" data-i18n-aria="allCountries"><option value="" data-i18n="allCountries"></option></select>
            <select id="dataclass" data-i18n-aria="allData"><option value="" data-i18n="allData"></option></select>
            <select id="sort" data-i18n-aria="sortLabel">
              <option value="added" data-i18n="sAdded"></option>
              <option value="score" data-i18n="sScore"></option>
              <option value="count" data-i18n="sCount"></option>
              <option value="date" data-i18n="sDate"></option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="reg">
            <thead>
              <tr>
                <th data-i18n="thSeverity"></th>
                <th data-i18n="thOrg"></th>
                <th class="col-type" data-i18n="thType"></th>
                <th class="col-data" data-i18n="thData"></th>
                <th class="col-volume r" data-i18n="thVolume"></th>
                <th class="col-country" data-i18n="thCountry"></th>
                <th class="col-date" data-i18n="thDate"></th>
              </tr>
            </thead>
            <tbody id="list"></tbody>
          </table>
        </div>
        <div class="list-foot">
          <span id="shown-count"></span>
          <button class="btn secondary" id="more" hidden data-i18n="more"></button>
        </div>
      </div>
    </section>

    <section id="exposition" class="section">
      <div class="panel">
        <div class="panel-head"><div><h2 data-i18n="checkTitle"></h2><p data-i18n="checkSub"></p></div></div>
        <div class="tools">
          <article class="tool">
            <h3 data-i18n="watchTitle"></h3>
            <p data-i18n-html="watchText"></p>
            <form id="watch-form" class="inline-form">
              <input id="watch-input" data-i18n-ph="watchPh" data-i18n-aria="watchPh" autocomplete="off">
              <button type="submit" class="btn" data-i18n="add"></button>
            </form>
            <div id="watch-tags" class="watch-tags"></div>
            <ul id="watch-results" class="watch-results"></ul>
          </article>

          <article class="tool">
            <h3 data-i18n="pwdTitle"></h3>
            <p data-i18n="pwdText"></p>
            <form id="pwd-form" class="inline-form">
              <input id="pwd" type="password" data-i18n-ph="pwdPh" data-i18n-aria="pwdPh" autocomplete="off">
              <button type="submit" class="btn" data-i18n="verify"></button>
            </form>
            <p id="pwd-result" class="pwd-result" aria-live="polite"></p>
          </article>

          <article class="tool">
            <h3 data-i18n="emailTitle"></h3>
            <p data-i18n="emailText"></p>
            <div class="btn-row">
              <a class="btn secondary" href="https://haveibeenpwned.com/" target="_blank" rel="noopener">Have I Been Pwned</a>
              <a class="btn secondary" href="https://monitor.mozilla.org/" target="_blank" rel="noopener">Mozilla Monitor</a>
            </div>
            <p class="small" data-i18n-html="rssText"></p>
          </article>
        </div>
      </div>
    </section>

    <section id="reponse" class="section">
      <div class="panel-head" style="padding:0 0 16px;border:0"><div><h2 data-i18n="actTitle"></h2><p data-i18n="actSub"></p></div></div>
      <div class="advice-grid" id="advice"></div>
      <div class="panel contacts">
        <div class="panel-head"><h2 data-i18n="hotlinesTitle"></h2></div>
        <div class="panel-body"><ul data-i18n-html="hotlines"></ul></div>
      </div>
    </section>

    <section id="veille" class="section">
      <div class="panel">
        <div class="panel-head">
          <div><h2 data-i18n="newsTitle"></h2><p data-i18n="newsSub"></p></div>
          <div class="filter-tabs" id="news-chips"></div>
        </div>
        <ul class="news" id="news"></ul>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">
        <a class="brand" href="./"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 3l7 2.6v5.2c0 4.4-3 7.4-7 8.6-4-1.2-7-4.2-7-8.6V5.6z" stroke-linejoin="round"/></svg></span>Breach Radar</a>
        <p data-i18n="footerAbout"></p>
        <p><a href="feed.xml">RSS</a></p>
      </div>
      <div>
        <h4 data-i18n="methodTitle"></h4>
        <div data-i18n-html="methodText"></div>
      </div>
      <div>
        <h4 data-i18n="sourcesTitle"></h4>
        <div data-i18n-html="sourcesText"></div>
      </div>
    </div>
    <div class="copyright"><div><span data-i18n="disclaimer"></span><span>Breach Radar</span></div></div>
  </footer>

  <dialog id="modal" class="drawer" aria-labelledby="m-title">
    <div id="modal-body"></div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
